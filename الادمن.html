<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة التحكم - معرض البحث العلمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{colors:{ink:'#0B2B36',mist:'#E6EEEC',cobalt:'#2149D1',gold:'#FFB81C',coral:'#E5484D'},
fontFamily:{kufi:['"Reem Kufi"','serif'],plex:['"IBM Plex Sans Arabic"','sans-serif']}}}}
</script>
<style>
body{background:#E6EEEC;background-image:radial-gradient(#0B2B3622 1px,transparent 1.2px);background-size:18px 18px;font-family:'IBM Plex Sans Arabic',sans-serif;color:#0B2B36}
.slab{background:#fff;border:2px solid #0B2B36;border-radius:14px;box-shadow:5px 5px 0 #0B2B36}
.inp{width:100%;border:2px solid #0B2B36;border-radius:10px;padding:.65rem .8rem;background:#fff;font-weight:500}
.btn{border:2px solid #0B2B36;border-radius:10px;padding:.6rem 1rem;font-weight:600;display:inline-flex;align-items:center;gap:.4rem;box-shadow:3px 3px 0 #0B2B36;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #0B2B36}
.ib{width:38px;height:38px;border:2px solid #0B2B36;border-radius:10px;display:grid;place-items:center;background:#fff;flex:none}
:focus-visible{outline:3px solid #2149D1;outline-offset:2px}
.bar{transition:width .6s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="min-h-screen">

<!-- ===== شاشة الدخول ===== -->
<section id="login" class="min-h-screen grid place-items-center p-4">
  <form id="lf" class="slab w-full max-w-sm p-6">
    <div class="w-14 h-14 rounded-xl bg-ink grid place-items-center mb-4" style="box-shadow:4px 4px 0 #FFB81C">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFB81C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
    </div>
    <h1 class="font-kufi font-bold text-3xl mb-1">لوحة التحكم</h1>
    <p class="text-sm opacity-75 mb-5">أدخل كلمة السر للمتابعة.</p>
    <input id="pw" type="password" class="inp mb-2" placeholder="كلمة السر" autocomplete="current-password" aria-label="كلمة السر">
    <p id="le" class="text-coral font-semibold text-sm h-5"></p>
    <button class="btn bg-gold w-full justify-center mt-2">دخول</button>
  </form>
</section>

<!-- ===== اللوحة ===== -->
<main id="dash" class="hidden max-w-5xl mx-auto p-4 pb-12">
  <header class="flex items-center justify-between gap-3 py-4">
    <h1 class="font-kufi font-bold text-3xl">معرض البحث العلمي</h1>
    <div class="flex items-center gap-3">
      <span id="st" class="flex items-center gap-2 text-sm font-semibold"><i class="w-3 h-3 rounded-full bg-coral inline-block"></i><span>غير متصل</span></span>
      <button id="out" class="btn bg-white">خروج</button>
    </div>
  </header>

  <div class="grid lg:grid-cols-5 gap-6">
    <!-- النتائج الحية: العنصر المميز -->
    <section class="lg:col-span-3 lg:order-2 rounded-2xl bg-ink text-white p-5 border-2 border-ink" style="box-shadow:6px 6px 0 #FFB81C">
      <div class="flex items-end justify-between mb-5">
        <div><h2 class="font-kufi font-bold text-2xl">النتائج المباشرة</h2><p class="text-sm opacity-70">تتحدث لحظياً دون إعادة تحميل.</p></div>
        <div class="text-left"><div id="tot" class="font-kufi font-bold text-5xl text-gold leading-none">0</div><div class="text-xs opacity-70 mt-1">إجمالي الأصوات</div></div>
      </div>
      <div id="res" class="space-y-4"></div>
      <div class="mt-6 pt-4 border-t border-white/20 flex items-center justify-between gap-3">
        <p class="text-sm opacity-70">الإعادة تصفّر الأصوات وتسمح للجميع بالتصويت مجدداً.</p>
        <button id="rst" class="btn bg-coral text-white flex-none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          <span>إعادة ضبط الأصوات</span></button>
      </div>
    </section>

    <!-- إدارة الفرق -->
    <section class="lg:col-span-2">
      <form id="af" class="slab p-4 mb-5">
        <label class="font-kufi font-bold text-xl block mb-2" for="nn">إضافة فريق</label>
        <div class="flex gap-2">
          <input id="nn" class="inp" placeholder="اسم الفريق أو المشروع" maxlength="60">
          <button class="btn bg-gold flex-none" aria-label="إضافة"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </form>
      <div id="tl" class="space-y-3"></div>
    </section>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ============================================================
   كلمة سر الأدمن: غيّرها هنا (السطر التالي)
   ============================================================ */
const ADMIN_PASSWORD = "123456";

/* ===== إعدادات Firebase ===== */
const firebaseConfig = {
  apiKey: "AIzaSyAgidiUSGZb3JqV9yXW-Ki32ovUZjeeerQ",
  authDomain: "science-fair-voting.firebaseapp.com",
  databaseURL: "https://science-fair-voting-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "science-fair-voting",
  storageBucket: "science-fair-voting.firebasestorage.app",
  messagingSenderId: "18056905745",
  appId: "1:18056905745:web:807c13defd7cf870565db0"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let teams = {}, round = 0, started = false;

/* ----- تسجيل الدخول: لا تُبنى اللوحة ولا يُشترك في النتائج قبل نجاحه ----- */
function enter() { $('login').classList.add('hidden'); $('dash').classList.remove('hidden'); if (!started) { started = true; listen(); } }
$('lf').onsubmit = e => {
  e.preventDefault();
  if ($('pw').value === ADMIN_PASSWORD) { sessionStorage.setItem('sf_admin', '1'); enter(); }
  else { $('le').textContent = 'كلمة السر غير صحيحة.'; $('pw').select(); }
};
$('out').onclick = () => { sessionStorage.removeItem('sf_admin'); location.reload(); };
if (sessionStorage.getItem('sf_admin') === '1') enter();

/* ----- الاشتراك في التغييرات الحية ----- */
function listen() {
  db.ref('.info/connected').on('value', s => {
    const on = s.val() === true;
    $('st').innerHTML = `<i class="w-3 h-3 rounded-full inline-block ${on ? 'bg-emerald-500' : 'bg-coral'}"></i><span>${on ? 'متصل' : 'غير متصل'}</span>`;
  });
  db.ref('meta/round').on('value', s => { round = s.val() || 0; });
  db.ref('teams').on('value', s => { teams = s.val() || {}; renderResults(); renderTeams(); });
}

function renderResults() {
  const list = Object.entries(teams).map(([id, t]) => ({ id, ...t, votes: t.votes || 0 })).sort((a, b) => b.votes - a.votes);
  const total = list.reduce((n, t) => n + t.votes, 0);
  $('tot').textContent = total;
  $('res').innerHTML = list.length ? list.map((t, i) => {
    const pct = total ? Math.round(t.votes / total * 100) : 0;
    return `<div>
      <div class="flex items-baseline justify-between gap-3 mb-1.5">
        <span class="font-kufi font-bold text-xl ${i===0&&total?'text-gold':''}">${esc(t.name)}</span>
        <span class="font-semibold text-sm whitespace-nowrap"><b class="text-lg">${t.votes}</b> صوت - ${pct}%</span></div>
      <div class="h-4 rounded-full bg-white/10 overflow-hidden"><div class="bar h-full rounded-full ${i===0&&total?'bg-gold':'bg-white/70'}" style="width:${pct}%"></div></div>
      <div class="text-xs opacity-60 mt-1">طلاب ${t.studentVotes || 0} - لجنة ${t.committeeVotes || 0}</div></div>`;
  }).join('') : '<p class="opacity-70 py-6">أضف فريقاً ليبدأ عرض النتائج.</p>';
}

function renderTeams() {
  const list = Object.entries(teams).sort((a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0));
  // لا نعيد البناء أثناء تعديل اسم، حتى لا يضيع ما كُتب
  if (document.activeElement && document.activeElement.dataset && document.activeElement.dataset.edit) return;
  $('tl').innerHTML = list.map(([id, t]) => `
    <div class="slab p-2 flex items-center gap-2" style="box-shadow:3px 3px 0 #0B2B36">
      <input class="inp" data-edit="${id}" value="${esc(t.name)}" maxlength="60" aria-label="اسم الفريق">
      <button class="ib bg-gold" data-save="${id}" aria-label="حفظ الاسم"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <button class="ib" data-del="${id}" aria-label="حذف الفريق"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    </div>`).join('');
}

/* ----- إضافة / تعديل / حذف ----- */
$('af').onsubmit = e => {
  e.preventDefault();
  const name = $('nn').value.trim(); if (!name) return;
  db.ref('teams').push({ name, votes: 0, studentVotes: 0, committeeVotes: 0, createdAt: firebase.database.ServerValue.TIMESTAMP });
  $('nn').value = '';
};
$('tl').onclick = e => {
  const s = e.target.closest('[data-save]'), d = e.target.closest('[data-del]');
  if (s) { const v = $('tl').querySelector(`[data-edit="${s.dataset.save}"]`).value.trim(); if (v) db.ref('teams/' + s.dataset.save + '/name').set(v).then(() => { document.activeElement.blur(); renderTeams(); }); }
  if (d) {
    if (d.dataset.arm) { db.ref('teams/' + d.dataset.del).remove(); return; }   // نقرة ثانية للتأكيد
    d.dataset.arm = 1; d.style.background = '#E5484D'; d.querySelector('svg').setAttribute('stroke', '#fff');
    setTimeout(() => { delete d.dataset.arm; d.style.background = ''; d.querySelector('svg')?.setAttribute('stroke', '#E5484D'); }, 3000);
  }
};

/* ----- إعادة الضبط: تصفير الأصوات + رفع رقم الجولة لفتح التصويت من جديد ----- */
let armed = false;
$('rst').onclick = () => {
  const lbl = $('rst').querySelector('span');
  if (!armed) { armed = true; lbl.textContent = 'اضغط مرة أخرى للتأكيد'; setTimeout(() => { armed = false; lbl.textContent = 'إعادة ضبط الأصوات'; }, 3500); return; }
  const up = { 'meta/round': round + 1 };
  Object.keys(teams).forEach(id => { up[`teams/${id}/votes`] = 0; up[`teams/${id}/studentVotes`] = 0; up[`teams/${id}/committeeVotes`] = 0; });
  db.ref().update(up); armed = false; lbl.textContent = 'تمت الإعادة';
  setTimeout(() => lbl.textContent = 'إعادة ضبط الأصوات', 2000);
};
</script>
</body>
</html>
